id: cloud_risk_alerts_gold_build
namespace: hslu.geopolitical_risk.subflows
labels:
  name: run_cloud_risk_alerts_gold_build

tasks:
  - id: run_cloud_risk_alerts_gold_build
    type: io.kestra.plugin.scripts.shell.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      set -eu
      cd /workspace

      if [ -f .env ]; then
        set -a
        . ./.env
        set +a
      fi

      uv run --no-dev --no-sync deng-ingestion warehouse build-risk-alerts-gold
