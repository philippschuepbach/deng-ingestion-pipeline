id: cloud_pipeline_run_scheduled
namespace: hslu.geopolitical_risk.main
labels:
  name: cloud_pipeline_run_scheduled

tasks:
  - id: cloud_datalake_ingest
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_datalake_ingest
    wait: true
    transmitFailed: true

  - id: cloud_events_silver_build
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_events_silver_build
    wait: true
    transmitFailed: true

  - id: cloud_risk_alerts_gold_build
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_risk_alerts_gold_build
    wait: true
    transmitFailed: true

triggers:
  - id: hourly_cloud_pipeline
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 * * * *"
    timezone: Europe/Zurich
