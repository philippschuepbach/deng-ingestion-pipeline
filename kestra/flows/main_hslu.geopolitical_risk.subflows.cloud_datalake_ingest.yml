id: cloud_datalake_ingest
namespace: hslu.geopolitical_risk.subflows
labels:
  name: run_cloud_datalake_ingest

inputs:
  - id: years
    type: INT
    defaults: 0
  - id: months
    type: INT
    defaults: 0
  - id: days
    type: INT
    defaults: 0
  - id: google_credentials_json_base64
    type: STRING
    defaults: ""

tasks:
  - id: run_cloud_datalake_ingest
    type: io.kestra.plugin.scripts.shell.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      set -eu
      cd /workspace

      export KESTRA_GOOGLE_CREDENTIALS_JSON_BASE64='{{ inputs.google_credentials_json_base64 }}'
      . /workspace/scripts/load_kestra_cloud_env.sh

      if [ "{{ inputs.years }}" != "0" ] || [ "{{ inputs.months }}" != "0" ] || [ "{{ inputs.days }}" != "0" ]; then
        uv run --no-dev --no-sync deng-ingestion datalake backfill \
          --years {{ inputs.years }} \
          --months {{ inputs.months }} \
          --days {{ inputs.days }}
      else
        uv run --no-dev --no-sync deng-ingestion datalake incremental
      fi
