id: cloud_pipeline_run_manual
namespace: hslu.geopolitical_risk.main
labels:
  name: cloud_pipeline_run_manual

inputs:
  - id: years
    type: INT
    defaults: 0
  - id: months
    type: INT
    defaults: 0
  - id: days
    type: INT
    defaults: 0

tasks:
  - id: cloud_datalake_ingest
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_datalake_ingest
    wait: true
    transmitFailed: true
    inputs:
      years: "{{ inputs.years }}"
      months: "{{ inputs.months }}"
      days: "{{ inputs.days }}"

  - id: cloud_events_silver_build
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_events_silver_build
    wait: true
    transmitFailed: true

  - id: cloud_risk_alerts_gold_build
    type: io.kestra.plugin.core.flow.Subflow
    namespace: hslu.geopolitical_risk.subflows
    flowId: cloud_risk_alerts_gold_build
    wait: true
    transmitFailed: true
