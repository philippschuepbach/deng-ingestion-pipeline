id: cloud_events_silver_build
namespace: hslu.geopolitical_risk.subflows
labels:
  name: run_cloud_events_silver_build

inputs:
  - id: google_credentials_json_base64
    type: STRING
    defaults: ""

tasks:
  - id: run_cloud_events_silver_build
    type: io.kestra.plugin.scripts.shell.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      set -eu
      cd /workspace

      export KESTRA_GOOGLE_CREDENTIALS_JSON_BASE64='{{ inputs.google_credentials_json_base64 }}'
      . /workspace/scripts/load_kestra_cloud_env.sh

      uv run --no-dev --no-sync deng-ingestion warehouse build-events-silver
